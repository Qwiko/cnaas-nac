name: Pytest

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

jobs:
  pytest:
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cnaas
          POSTGRES_PASSWORD: cnaas
          POSTGRES_DB: nac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --group dev pytest -vv --showlocals
        env:
          POSTGRES_SERVER: 127.0.0.1
