name: CNaaS NAC

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  pytest:
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cnaas
          POSTGRES_PASSWORD: cnaas
          POSTGRES_DB: nac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: POSTGRES_SERVER=127.0.0.1 uv run pytest
