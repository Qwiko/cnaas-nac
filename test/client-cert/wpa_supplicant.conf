ctrl_interface=/var/run/wpa_supplicant
eapol_version=2
ap_scan=0
fast_reauth=1
network={
	key_mgmt=IEEE8021X
	eap=TLS
    identity="user@example.org"
	ca_cert="/tmp/ca.pem"
	client_cert="/tmp/client.pem"
	private_key="/tmp/client.key"
	private_key_passwd="whatever"
}

# wpa_supplicant -Dwired -i eth1 -c /tmp/wpa_supplicant.conf