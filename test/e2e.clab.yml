name: cnaas-nac-e2e

mgmt:
  network: cnaas_nac_mgmt # management network name
  ipv4-subnet: 10.100.2.0/24 # ipv4 range
  ipv4-gw: 10.100.2.1

topology:
  kinds:
    arista_ceos:
      image-pull-policy: Never

  nodes:
    eos-a1:
      kind: arista_ceos
      image: ceos:4.32.5.1M
      startup-config: eos-a1_startup_config.txt
      mgmt-ipv4: 10.100.2.11
    eos-a2:
      kind: arista_ceos
      image: ceos:4.32.5.1M
      startup-config: eos-a2_startup_config.txt
      mgmt-ipv4: 10.100.2.12

    alpine-c1:
      kind: linux
      image: alpine:latest
      exec:
        - apk add wpa_supplicant
        - ip address add 192.168.1.2/24 dev eth1
    alpine-c2:
      kind: linux
      image: alpine:latest
      exec:
        - apk add wpa_supplicant
        - ip address add 192.168.1.3/24 dev eth1
    alpine-c3:
      kind: linux
      image: alpine:latest
      exec:
        - apk add wpa_supplicant
        - ip address add 192.168.2.2/24 dev eth1
    alpine-c4:
      kind: linux
      image: alpine:latest
      exec:
        - apk add wpa_supplicant
        - ip address add 192.168.2.3/24 dev eth1

  links:
    - endpoints: ["eos-a1:eth1", "alpine-c1:eth1"]
    - endpoints: ["eos-a1:eth2", "alpine-c2:eth1"]

    - endpoints: ["eos-a2:eth1", "alpine-c3:eth1"]
    - endpoints: ["eos-a2:eth2", "alpine-c4:eth1"]
