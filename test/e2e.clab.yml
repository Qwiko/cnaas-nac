name: cnaas-nac-e2e

mgmt:
  network: cnaas_nac_mgmt # management network name
  ipv4-subnet: 10.100.2.0/24 # ipv4 range
  ipv4-gw: 10.100.2.1

topology:
  kinds:
    arista_ceos:
      image-pull-policy: Never

  nodes:
    eos-a1:
      kind: arista_ceos
      image: ceos:${ARISTA_VERSION:=4.35.4M}
      labels:
        name: eos-a1
      startup-config: configs/eos-a1_startup_config.txt
      mgmt-ipv4: 10.100.2.11

    alpine-c1:
      kind: linux
      image: alpine:latest
      labels:
        name: alpine-c1
      exec:
        - ip link set dev eth1 address 02:43:ac:00:00:c1
        - ip address add 192.168.1.2/24 dev eth1
        - ip address add fd00:192:168:1::2/64 dev eth1
        - apk add wpa_supplicant nano
    alpine-c2:
      kind: linux
      image: alpine:latest
      labels:
        name: alpine-c2
      exec:
        - ip link set dev eth1 address 02:43:ac:00:00:c2
        - ip address add 192.168.1.3/24 dev eth1
        - ip address add fd00:192:168:1::3/64 dev eth1
        - apk add wpa_supplicant nano
    alpine-c3:
      kind: linux
      image: alpine:latest
      labels:
        name: alpine-c3
      exec:
        - ip link set dev eth1 address 02:43:ac:00:00:c3
        - ip address add 192.168.1.4/24 dev eth1
        - ip address add fd00:192:168:1::4/64 dev eth1
        - apk add wpa_supplicant nano

  links:
    - endpoints: ["eos-a1:eth1", "alpine-c1:eth1"]
    - endpoints: ["eos-a1:eth2", "alpine-c2:eth1"]
    - endpoints: ["eos-a1:eth3", "alpine-c3:eth1"]
