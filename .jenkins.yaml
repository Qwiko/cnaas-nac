#
# Jenkins pipeline for CNaaS
#

disabled: false

git:
  branch: develop
  extensions:
    shallow_clone: true

extra_jobs:
  - name: nac-authapi
    git:
      branch: develop
    builders:
      - docker
    pre_build_script:
      - cp docker/api/Dockerfile .
    docker_name: cnaas/nac-authapi
    docker_context_dir: .

  - name: nac-radius
    git:
      branch: develop
    builders:
      - docker
    pre_build_script:
      - cp docker/radius/Dockerfile .
    docker_name: cnaas/nac-radius
    docker_context_dir: .