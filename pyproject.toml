[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "cnaas_nac"
description = "Campus Network as-a-Service - NAC (Campus network automation software)"
authors = [
  { name = "SUNET" },
]
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "apscheduler==3.11.3",
  "asyncpg",
  "authlib==1.7.2",
  "fastapi[standard-no-fastapi-cloud-cli]",
  "fastapi==0.141.1",
  "netutils>=1.15.1",
  "psycopg2-binary==2.9.12",
  "pydantic==2.13.4",
  "pyrad==2.5.4",
  "sqlalchemy==2.0.51",
  "itsdangerous==2.2.0",
  "fastapi-filter==3.0.0",
  "cachetools==7.1.7",
  "requests==2.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "mypy==1.19.1",
  "types-setuptools==82.0.0.20260210",
  "types-requests>=2.33.0.20260327",
  "types-cachetools>=6.2.0.20260317",
  "ruff==0.14.14",
]
docs = [
  "zensical>=0.0.52",
]

#[project.readme]
#file = "README.md"
#content-type = "text/markdown"

[tool.nosetests]
match = "^test"
where = "src/cnaas_nac"
nocapture = "1"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = "(bin/*|alembic/*)"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[project.urls]
Issues = "https://github.com/SUNET/cnaas-nac/issues"
Repository = "https://github.com/sunet/cnaas-nac"

[tool.setuptools.packages.find]
where = [ "src" ]
exclude = [ "tests" ]

[tool.ruff]
target-version = "py314"
#line-length = 120
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "venv",
]

[pytest]
testpaths = [
    "src"
]
pythonpath = ["src"]
