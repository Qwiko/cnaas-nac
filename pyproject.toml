[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[project]
name = "cnaas_nac"
description = "Campus Network as-a-Service - NAC (Campus network automation software)"
authors = [
  { name = "SUNET" },
]
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.4",
  "apscheduler==3.11.2",
  "asyncpg",
  "authlib==1.6.8",
  "fastapi[standard-no-fastapi-cloud-cli]",
  "fastapi==0.128.8",
  "netutils>=1.15.1",
  "psycopg2_binary==2.9.11",
  "pydantic==2.12.5",
  "pyrad==2.5.4",
  "sqlalchemy",
  "itsdangerous==2.2.0",
  "fastapi_filter==2.0.1",
  "cachetools==7.0.5",
  "requests==2.32.5",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "mypy==1.19.1",
  "types-setuptools==82.0.0.20260210",
]

#[project.readme]
#file = "README.md"
#content-type = "text/markdown"

[tool.nosetests]
match = "^test"
where = "src/cnaas_nac"
nocapture = "1"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# check_untyped_defs = True
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# warn_return_any = True
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = "(src/*|bin/*)"
mypy_path = "mypy_stubs"
# lineprecision_report = mypy-coverage
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = "True"
init_typed = "True"
warn_required_dynamic_aliases = "True"
warn_untyped_fields = "True"

[project.urls]
Issues = "https://github.com/SUNET/cnaas-nac/issues"
Repository = "https://github.com/sunet/cnaas-nac"

[tool.setuptools.packages.find]
where = [ "src" ]
exclude = [ "tests" ]

[tool.ruff]
target-version = "py314"
#line-length = 120
exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "venv",
]

[pytest]
testpaths = [
    "src"
]
pythonpath = ["src"]